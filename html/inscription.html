<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inscrivez-vous</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.0.0/dist/css/bootstrap.min.css" integrity="sha384-Gn5384xqQ1aoWXA+058RXPxPg6fy4IWvTNh0E263XmFcJlSAwiGgFAW/dAiS6JXm" crossorigin="anonymous"> 
    <script src="../script.js" defer></script>
    <link rel="stylesheet" href="../style.css">

    

</head>
<body>
    <h1>Inscrivez-vous</h1>
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
        <ul class="navbar-nav">
            <li class="nav-item active"><a class="nav-link" href="accueil.html">Accueil</a></li>
            <li class="nav-item"><a class="nav-link" href="inscription.html">S'inscrire</a></li>
            <li class="nav-item"><a class="nav-link" href="jouer.html">Jouer</a></li>
        </ul>
    </nav>
    <form   id="inscriptionForm">
            <div class="champ">
                <label for="name">Nom d'utilisateur :</label>
                <input type="text" id="name" name="name" required>
            </div>
            <br>
            <div class="champ">
                <label for="email" >Email :</label>
                <input type="email" id="email" name="email" required>
            </div>
            <br>
            <div class="champ">
                <label for="password">Mot de passe :</label>
                <input type="password" id="password" name="password" required>
            </div>
            <br>

            <div class="champ">
                <label for="confirmPassword">Confirmer le mot de passe :</label>
                <input type="password" id="confirmPassword" name="confirmPassword" required>
            </div>
            <button type="submit" class="btn btn-success">Créer un compte </button>
            <button type="reset" class="btn btn-secondary">Annuler</button>
    </form>    
</body>
</html>
